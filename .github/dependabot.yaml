## https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 10
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: perf
      include: scope
  - package-ecosystem: npm
    directories:
      - /
      - packages/*
    open-pull-requests-limit: 10
    versioning-strategy: increase
    schedule:
      interval: weekly
      day: saturday
      time: "01:00" ## UTC
    cooldown:
      default-days: 14
      semver-major-days: 60
    commit-message:
      prefix: perf
      include: scope
    groups:
      vitest:
        patterns:
          - "@vitest/*"
          - vitest
          - memfs
      tsdown:
        patterns:
          - "@tsdown/*"
          - tsdown
      typedoc:
        patterns:
          - typedoc
          - typedoc-*
      textlint:
        patterns:
          - textlint
          - textlint-*
      commitlint:
        patterns:
          - "@commitlint/*"
          - commitizen
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
