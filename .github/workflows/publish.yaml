name: Publish packages

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: production
      ## Use outputs from publish script to set the URL dynamically
      url: https://www.npmjs.com/package/${{ steps.publish.outputs.package }}/v/${{ steps.publish.outputs.version }}
    steps:
      - name: Set up source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up runtime
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          require-lockfile: true
          cache: true
      - name: Build configurations
        run: pnpm build:config
      - name: Publish version
        id: publish
        run: bash ./scripts/package-publish.sh
