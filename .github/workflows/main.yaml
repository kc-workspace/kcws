name: Main

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Set up source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Set up nodejs
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Build configurations
        run: pnpm build:config
      - name: Validate current commit
        if: github.event_name == 'push'
        run: pnpm check:commit --last --verbose
      - name: Validate pull-request title
        if: github.event_name == 'pull_request'
        run: echo "$PR_TITLE" | pnpm check:commit --verbose
        env:
          PR_TITLE: "${{ github.event.pull_request.title }}"

  licensecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Set up source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan dependencies
        uses: fossas/fossa-action@29693cc50323968e039056be419b32989fc5880c # v2.0.0
        with:
          api-key: ${{ secrets.FOSSA_API_KEY }}
      - name: Test dependencies
        uses: fossas/fossa-action@29693cc50323968e039056be419b32989fc5880c # v2.0.0
        with:
          api-key: ${{ secrets.FOSSA_API_KEY }}
          run-tests: true

  zizmorcheck:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Set up source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Security Analysis with Zizmor
        uses: zizmorcore/zizmor-action@6599ee8b7a49aef6a770f63d261d214911a7ce02 # v0.6.0
        with:
          config: .github/linters/zizmor.yaml

  megalintcheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write ## Write commit statuses
      pull-requests: write ## Write pull-request comments
      security-events: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: MegaLinter
        uses: oxsecurity/megalinter/flavors/javascript@ef3e84b8b836d76db562d0f3ed7da61e8fd538bc # v9.6.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MEGALINTER_CONFIG: .github/linters/.mega-linter.yaml
          ## Disable lychee (broken links checker) errors on release pull requests
          SPELL_LYCHEE_DISABLE_ERRORS: "${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'autorelease: pending') && 'true' || 'false' }}"
          ## Disable grype (vulnerability scanner) errors on Dependabot pull requests
          REPOSITORY_GRYPE_DISABLE_ERRORS: "${{ github.event_name == 'pull_request' && github.actor == 'dependabot[bot]' && 'true' || 'false' }}"
      ## NOTE: disable for now as it creates too much noise in the logs
      # - name: Upload MegaLinter results to GitHub Security tab
      #   if: success() || failure()
      #   uses: github/codeql-action/upload-sarif@5d4e8d1aca955e8d8589aabd499c5cae939e33c7 # v4.31.9
      #   with:
      #     sarif_file: "megalinter-reports/megalinter-report.sarif"
      - name: Upload MegaLinter reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success() || failure()
        with:
          name: MegaLinter reports
          include-hidden-files: "true"
          path: |
            megalinter-reports
            mega-linter.log

  main:
    runs-on: ubuntu-latest
    needs:
      - commitcheck
      - licensecheck
      - zizmorcheck
    steps:
      - name: Set up source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Set up nodejs
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Build configurations
        run: pnpm build:config
      - name: Check code styles
        run: pnpm check:all
      - name: Build packages
        run: pnpm build:all
      - name: Test packages
        run: pnpm test:all
      - name: Scan source code
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: reports
          retention-days: 5

  testing:
    runs-on: ubuntu-latest
    needs:
      - main
    strategy:
      matrix:
        # https://nodejs.org/en/about/previous-releases
        node-version: [22, 24, 25, 26]
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up nodejs
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install
      - name: Build configurations
        run: pnpm build:config
      - name: Build packages
        run: pnpm build:all
      - name: Test packages
        run: pnpm test:all

