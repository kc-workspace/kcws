packages:
  - packages/@kcconfigs/*
  - packages/@kcexamples/*
  - packages/@kcinternals/*
  - packages/@kctools/*
  - packages/@kctypes/*
  - packages/@kcws/*
  - '!packages/**/.*.old/**'

catalog:
  '@arethetypeswrong/core': 0.18.2
  '@biomejs/biome': 2.4.10
  '@ls-lint/ls-lint': 2.3.1
  '@types/node': ^24.0.0
  lefthook: 2.1.4
  publint: 0.3.18
  rimraf: 6.1.3
  tsdown: 0.20.3
  typescript: 5.9.3
  unplugin-unused: 0.5.7
  vite: 8.0.1
  zshy: 0.7.0

catalogs:
  commitlint:latest:
    '@commitlint/cli': 20.5.0
    '@commitlint/config-conventional': 20.5.0
    '@commitlint/cz-commitlint': 20.5.0
    '@commitlint/types': 20.5.0
    commitizen: 4.3.1
    inquirer: ^9.3.8
  commitlint:peer:
    '@commitlint/cli': ^20.0.0
  peer:
    '@arethetypeswrong/core': ^0.18.0
    '@biomejs/biome': ^2.0.0
    publint: ^0.3.0
    tsdown: ^0.20.0
    typescript: ^5.5.0
    unplugin-unused: ^0.5.0
    vite: ^8.0.0-beta
    vitest: ^4.0.0
    zshy: ^0.6.0
  test:latest:
    '@vitest/coverage-v8': 4.1.2
    '@vitest/ui': 4.1.2
    memfs: 4.56.11
    vitest: 4.1.2
  test:peer:
    '@vitest/coverage-v8': ^4.0.0
    '@vitest/ui': ^4.0.0
    memfs: ^4.0.0
    vitest: ^4.0.0
  textlint:latest:
    textlint: 15.5.2
    textlint-filter-rule-allowlist: 4.0.0
    textlint-filter-rule-comments: 1.3.0
    textlint-rule-terminology: 5.2.16
  textlint:peer:
    textlint: ^15.0.0
  typedoc:latest:
    typedoc: 0.28.17
    typedoc-github-theme: 0.4.0
    typedoc-material-theme: 1.4.1
    typedoc-plugin-dt-links: 2.0.46
    typedoc-plugin-extras: 4.0.1
    typedoc-plugin-include-example: 3.0.2
    typedoc-plugin-mdn-links: 5.1.1
    typedoc-plugin-missing-exports: 4.1.2
    typedoc-rhineai-theme: 1.2.0
    typedoc-theme-oxide: 0.2.5
    varvara-typedoc-theme: 0.3.9
  typedoc:peer:
    typedoc: ^0.28.0
    typedoc-github-theme: ^0.3.0
    typedoc-material-theme: ^1.0.0
    typedoc-plugin-dt-links: ^2.0.0
    typedoc-plugin-extras: ^4.0.0
    typedoc-plugin-include-example: ^3.0.0
    typedoc-plugin-mdn-links: ^5.0.0
    typedoc-plugin-missing-exports: ^4.0.0
    typedoc-rhineai-theme: ^1.0.0
    typedoc-theme-oxide: ^0.2.0
    varvara-typedoc-theme: ^0.3.0

engineStrict: true

failIfNoMatch: true

includeWorkspaceRoot: false

nodeLinker: isolated

onlyBuiltDependencies:
  - esbuild
  - lefthook

overrides:
  ## force all @types/node to be v24
  '@types/node@>=25.0.0': '^24.0.0'
  '@types/node@<24.0.0': '^24.0.0'
  ## commitizen>glob>minimatch>brace-expansion
  brace-expansion@<1.1.13: '>=1.1.13 <2.0.0'
  ## textlint>glob>minimatch>brace-expansion
  brace-expansion@>=2.0.0 <2.0.3: '>=2.0.3 <3.0.0'
  ## kcconfigs__textlint>textlint>glob>minimatch>brace-expansion
  brace-expansion@>=4.0.0 <5.0.5: '>=5.0.5 <6.0.0'
  ## kcconfigs__commitlint>@pnpm/workspace.find-packages>...>cross-spawn
  cross-spawn@>=7.0.0 <7.0.5: '>=7.0.5 <8.0.0'
  ## commitizen>lodash
  ## commitizen>inquirer>lodash
  lodash@>=4.0.0 <=4.17.23: '>=4.18.0 <5.0.0'
  ## textlint>@modelcontextprotocol/sdk>express>router>path-to-regexp
  path-to-regexp@>=8.0.0 <8.4.0: '>=8.4.0 <9.0.0'
  ## commitizen>find-node-modules>findup-sync>micromatch>picomatch
  picomatch@<2.3.2: '>=2.3.2 <3.0.0'
  ## @vitest/ui>tinyglobby>picomatch
  picomatch@>=4.0.0 <4.0.4: '>=4.0.4 <5.0.0'
  ## commitizen>inquirer>external-editor>tmp
  tmp@<=0.2.3: '>=0.2.4 <1.0.0'
  ## typedoc>yaml
  yaml@>=2.0.0 <2.8.3: '>=2.8.3 <3.0.0'

packageManagerStrict: true

packageManagerStrictVersion: true

preferWorkspacePackages: true

publishBranch: main

saveWorkspaceProtocol: rolling

sharedWorkspaceLockfile: true

strictPeerDependencies: true
