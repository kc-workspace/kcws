packages:
  - packages/@kcconfigs/*
  - packages/@kcexamples/*
  - packages/@kcinternals/*
  - packages/@kctools/*
  - packages/@kctypes/*
  - packages/@kcws/*
  - '!packages/**/.*.old/**'

catalog:
  '@arethetypeswrong/core': 0.18.2
  '@biomejs/biome': 2.3.10
  '@ls-lint/ls-lint': 2.3.1
  '@types/node': ^24.0.0
  lefthook: 2.0.15
  publint: 0.3.16
  rimraf: 6.1.2
  tsdown: 0.20.3
  typescript: 5.9.3
  unplugin-unused: 0.5.6
  vite: 8.0.0-beta.7
  zshy: 0.7.0

catalogs:
  commitlint:latest:
    '@commitlint/cli': 20.3.1
    '@commitlint/config-conventional': 20.3.1
    '@commitlint/cz-commitlint': 20.3.1
    '@commitlint/types': 20.3.1
    commitizen: 4.3.1
    inquirer: ^9.3.8
  commitlint:peer:
    '@commitlint/cli': ^20.0.0
  peer:
    '@arethetypeswrong/core': ^0.18.0
    '@biomejs/biome': ^2.0.0
    publint: ^0.3.0
    tsdown: ^0.18.0
    typescript: ^5.5.0
    unplugin-unused: ^0.5.0
    vite: ^8.0.0-beta
    vitest: ^4.0.0
    zshy: ^0.6.0
  test:latest:
    '@vitest/coverage-v8': 4.0.15
    '@vitest/ui': 4.0.15
    memfs: 4.51.1
    vitest: 4.0.15
  test:peer:
    '@vitest/coverage-v8': ^4.0.0
    '@vitest/ui': ^4.0.0
    memfs: ^4.0.0
    vitest: ^4.0.0
  textlint:latest:
    textlint: 15.5.0
    textlint-filter-rule-allowlist: 4.0.0
    textlint-filter-rule-comments: 1.3.0
    textlint-rule-terminology: 5.2.16
  textlint:peer:
    textlint: ^15.0.0
  typedoc:latest:
    typedoc: 0.28.15
    typedoc-github-theme: 0.3.1
    typedoc-material-theme: 1.4.1
    typedoc-plugin-dt-links: 2.0.36
    typedoc-plugin-extras: 4.0.1
    typedoc-plugin-include-example: 3.0.2
    typedoc-plugin-mdn-links: 5.0.10
    typedoc-plugin-missing-exports: 4.1.2
    typedoc-rhineai-theme: 1.2.0
    typedoc-theme-oxide: 0.2.0
    varvara-typedoc-theme: 0.3.9
  typedoc:peer:
    typedoc: ^0.28.0
    typedoc-github-theme: ^0.3.0
    typedoc-material-theme: ^1.0.0
    typedoc-plugin-dt-links: ^2.0.0
    typedoc-plugin-extras: ^4.0.0
    typedoc-plugin-include-example: ^3.0.0
    typedoc-plugin-mdn-links: ^5.0.0
    typedoc-plugin-missing-exports: ^4.0.0
    typedoc-rhineai-theme: ^1.0.0
    typedoc-theme-oxide: ^0.2.0
    varvara-typedoc-theme: ^0.3.0

engineStrict: true

failIfNoMatch: true

includeWorkspaceRoot: false

nodeLinker: isolated

onlyBuiltDependencies:
  - esbuild
  - lefthook

overrides:
  ## textlint>@modelcontextprotocol/sdk
  '@modelcontextprotocol/sdk@<1.25.2': '>=1.25.2'
  ## @pnpm/workspace.find-packages>...>@yarnpkg/shell>cross-spawn
  cross-spawn@>=7.0.0 <7.0.5: '>=7.0.5'
  ## textlint>@modelcontextprotocol/sdk>@hono/node-server>hono
  hono@<4.11.4: '>=4.11.4'
  ## textlint>@modelcontextprotocol/sdk>express>body-parser>qs
  qs@<6.14.1: '>=6.14.1'
  ## commitizen>inquirer>external-editor>tmp
  tmp@<0.2.4: '>=0.2.4'

packageManagerStrict: true

packageManagerStrictVersion: true

preferWorkspacePackages: true

publishBranch: main

saveWorkspaceProtocol: rolling

sharedWorkspaceLockfile: true

strictPeerDependencies: true
peerDependencyRules:
  allowedVersions:
    hono: 4.11.4
