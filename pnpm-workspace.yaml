packages:
  - packages/@kcconfigs/*
  - packages/@kcexamples/*
  - packages/@kcinternals/*
  - packages/@kcstyles/*
  - packages/@kctools/*
  - packages/@kctypes/*
  - packages/@kcws/*
  - "!packages/**/.*.old/**"

catalog:
  "@arethetypeswrong/core": 0.18.4
  "@biomejs/biome": 2.5.3
  "@ls-lint/ls-lint": 2.3.1
  "@types/node": ^24.0.0
  "@types/bun": ^1.3.14
  lefthook: 2.1.9
  publint: 0.3.21
  rimraf: 6.1.3
  tsdown: 0.22.7
  typescript: 6.0.3
  unplugin-unused: 0.5.7
  unrun: 0.3.1
  vite: 8.1.3
  yaml: 2.9.0
  zshy: 0.7.3
  zod: 4.4.3

catalogs:
  peer:
    "@arethetypeswrong/core": ^0.18.0
    "@biomejs/biome": ^2.0.0
    publint: ^0.3.0
    tsdown: ^0.22.7
    typescript: ^6.0.0
    unplugin-unused: ^0.5.0
    unrun: ^0.3.0
    vite: ^8.0.0-beta
    vitest: ^4.0.0
    zshy: ^0.6.0
  css:latest:
    "@tsdown/css": 0.22.7
    lightningcss: 1.32.0
    sass-embedded: 1.100.0
  commitlint:latest:
    "@commitlint/cli": 21.2.1
    "@commitlint/config-conventional": 21.2.0
    "@commitlint/cz-commitlint": 21.2.0
    "@commitlint/types": 21.2.0
    commitizen: 4.3.2
    inquirer: ^9.3.8
  commitlint:peer:
    "@commitlint/cli": ^20.0.0
  test:latest:
    "@vitest/coverage-v8": 4.1.7
    "@vitest/ui": 4.1.7
    memfs: 4.57.8
    vitest: 4.1.7
  test:peer:
    "@vitest/coverage-v8": ^4.0.0
    "@vitest/ui": ^4.0.0
    memfs: ^4.0.0
    vitest: ^4.0.0
  typedoc:latest:
    typedoc: 0.28.19
    typedoc-github-theme: 0.4.0
    typedoc-material-theme: 1.4.1
    typedoc-plugin-dt-links: 2.0.61
    typedoc-plugin-extras: 4.0.1
    typedoc-plugin-include-example: 3.0.2
    typedoc-plugin-mdn-links: 5.1.1
    typedoc-plugin-missing-exports: 4.1.3
    typedoc-rhineai-theme: 1.2.0
    typedoc-theme-oxide: ^0.3.0
  typedoc:peer:
    typedoc: ^0.28.0
    typedoc-github-theme: ^0.3.0
    typedoc-material-theme: ^1.0.0
    typedoc-plugin-dt-links: ^2.0.0
    typedoc-plugin-extras: ^4.0.0
    typedoc-plugin-include-example: ^3.0.0
    typedoc-plugin-mdn-links: ^5.0.0
    typedoc-plugin-missing-exports: ^4.0.0
    typedoc-rhineai-theme: ^1.0.0
    typedoc-theme-oxide: ^0.2.0
  actions:latest:
    "@actions/core": 3.0.1

engineStrict: true
strictPeerDependencies: true

failIfNoMatch: true

includeWorkspaceRoot: false

nodeLinker: isolated

overrides:
  ## force all @types/node to be v24
  "@types/node@*": ^24.0.0
  ## commitizen>glob>minimatch>brace-expansion
  brace-expansion@<1.1.13: ^1.1.13
  ## kcconfigs__commitlint>@pnpm/workspace.find-packages>...>cross-spawn
  cross-spawn@>=7.0.0 <7.0.5: ^7.0.5
  ## @commitlint/cli>@commitlint/load>...>ajv>fast-uri
  fast-uri@<3.1.4: ^3.1.4
  ## commitizen>lodash
  ## commitizen>inquirer>lodash
  lodash@>=4.0.0 <4.17.24: ^4.18.0
  ## commitizen>find-node-modules>findup-sync>micromatch>picomatch
  picomatch@<2.3.2: ^2.3.2
  ## @vitest/ui>tinyglobby>picomatch
  picomatch@>=4.0.0 <4.0.4: ^4.0.4
  ## commitizen>inquirer>external-editor>tmp
  tmp@<0.2.7: ^0.2.7
  ## typedoc>yaml
  yaml@>=2.0.0 <2.8.3: ^2.8.3
  ## textlint>@modelcontextprotocol/sdk>@hono/node-server>hono
  hono@<4.12.25: ^4.12.25
  ## @actions/core>@actions/http-client>undici
  undici@<6.27.0: ^6.27.0
  ## typedoc-theme-oxide>cheerio>undici
  undici@>=7.0.0 <7.28.0: ^7.28.0
  ## @vitest/ui>vitest>@vitest/mocker>vite
  vite@>=8.0.0 <8.0.16: ^8.0.16
  ## kcconfigs__commitlint>@pnpm/workspace.find-packages>...>adm-zip
  adm-zip@<0.6.0: ^0.6.0

preferWorkspacePackages: true

publishBranch: main

saveWorkspaceProtocol: rolling

sharedWorkspaceLockfile: true

allowBuilds:
  esbuild: true
  lefthook: true
  "@parcel/watcher": false
  bun: false

pmOnFail: error

minimumReleaseAge: 1440 ## 1 day in minutes
minimumReleaseAgeExclude: [fast-uri@3.1.4]
