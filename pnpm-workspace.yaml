packages:
  - packages/@kcconfigs/*
  - packages/@kcexamples/*
  - packages/@kcinternals/*
  - packages/@kcstyles/*
  - packages/@kctools/*
  - packages/@kctypes/*
  - packages/@kcws/*
  - "!packages/**/.*.old/**"

engineStrict: true
strictPeerDependencies: true
dedupePeerDependents: true
dedupePeers: true

publishBranch: main

sharedWorkspaceLockfile: true
preferWorkspacePackages: true
includeWorkspaceRoot: false
saveWorkspaceProtocol: rolling
nodeLinker: isolated
failIfNoMatch: true
pmOnFail: error

minimumReleaseAge: 1440 ## 1 day in minutes
minimumReleaseAgeExclude: []

overrides:
  ## force all @types/node to be v24
  "@types/node@*": ^24.0.0
  ## commitizen>glob>minimatch>brace-expansion
  brace-expansion@<5.0.9: ^5.0.9
  ## kcconfigs__commitlint>@pnpm/workspace.find-packages>...>cross-spawn
  cross-spawn@>=7.0.0 <7.0.5: ^7.0.5
  ## @commitlint/cli>@commitlint/load>...>ajv>fast-uri
  fast-uri@<3.1.6: ^3.1.6
  ## kcconfigs__textlint>textlint>@modelcontextprotocol/sdk>express-rate-limit>ip-address
  ## kcconfigs__commitlint>@pnpm/workspace.find-packages>...>socks>ip-address
  ip-address@<10.3.1: ^10.3.1
  ## kcconfigs__commitlint>@pnpm/workspace.find-packages>...>@yarnpkg/parsers>js-yaml
  js-yaml@<3.15.2: ^3.15.2
  ## kcconfigs__textlint>textlint>@textlint/linter-formatter>js-yaml
  js-yaml@>=4.0.0 <4.3.2: ^4.3.2
  ## commitizen>lodash
  ## commitizen>inquirer>lodash
  lodash@>=4.0.0 <4.17.24: ^4.18.0
  ## commitizen>find-node-modules>findup-sync>micromatch>picomatch
  picomatch@<2.3.2: ^2.3.2
  ## @vitest/ui>tinyglobby>picomatch
  picomatch@>=4.0.0 <4.0.4: ^4.0.4
  ## commitizen>inquirer>external-editor>tmp
  tmp@<0.2.7: ^0.2.7
  ## typedoc>yaml
  yaml@>=2.0.0 <2.8.3: ^2.8.3
  ## @actions/core>@actions/http-client>undici
  undici@<6.27.0: ^6.27.0
  ## typedoc-theme-oxide>cheerio>undici
  undici@>=7.0.0 <7.29.0: ^7.29.0
  ## @vitest/ui>vitest>@vitest/mocker>vite
  vite@>=8.0.0 <8.0.16: ^8.0.16
  ## kcconfigs__commitlint>@pnpm/workspace.find-packages>...>adm-zip
  adm-zip@<0.6.0: ^0.6.0

allowBuilds:
  esbuild: true
  lefthook: true
  "@parcel/watcher": false
  bun: false
