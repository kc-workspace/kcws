## https://pnpm.io/settings
nodeLinker: isolated

engineStrict: true
packageManagerStrict: true
packageManagerStrictVersion: true

includeWorkspaceRoot: false
preferWorkspacePackages: true
sharedWorkspaceLockfile: true
saveWorkspaceProtocol: rolling
failIfNoMatch: true

onlyBuiltDependencies:
  - lefthook

packages:
  - "packages/@kcconfigs/*"
  - "packages/@kcexamples/*"
  - "packages/@kcinternals/*"
  - "packages/@kctools/*"
  - "packages/@kctypes/*"
  - "packages/@kcutils/*"
  - "packages/@kcws/*"
  - "!packages/**/.*.old/**"

catalog:
  "@types/node": ^22.0.0
  ## Update json schema version in @kcconfigs/biome as well
  "@biomejs/biome": 2.3.8
  "@vitest/coverage-v8": 4.0.15
  "@vitest/ui": 4.0.15
  lefthook: 2.0.9
  publint: 0.3.15
  typescript: 5.9.3
  vite: 8.0.0-beta.0
  vitest: 4.0.15
  tsdown: 0.17.1
  typedoc: 0.28.15
  typedoc-plugin-dt-links: 2.0.32
  typedoc-plugin-extras: 4.0.1
  typedoc-plugin-mdn-links: 5.0.10
  typedoc-plugin-include-example: 3.0.2
  typedoc-plugin-missing-exports: 4.1.2
  zshy: 0.6.0

catalogs:
  peer:
    "@biomejs/biome": ^2.0.0
    publint: ^0.3.0
    typescript: ^5.0.0
    vite: ^8.0.0-beta
    vitest: ^4.0.0
    tsdown: ^0.17.0
    zshy: ^0.6.0
