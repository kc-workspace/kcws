packages:
  - packages/@kcconfigs/*
  - packages/@kcexamples/*
  - packages/@kcinternals/*
  - packages/@kctools/*
  - packages/@kctypes/*
  - packages/@kcws/*
  - "!packages/**/.*.old/**"

catalog:
  "@arethetypeswrong/core": 0.18.2
  "@biomejs/biome": 2.3.8
  "@types/node": ^24.0.0
  "@vitest/coverage-v8": 4.0.15
  "@vitest/ui": 4.0.15
  lefthook: 2.0.9
  publint: 0.3.16
  tsdown: 0.18.1
  typescript: 5.9.3
  unplugin-unused: 0.5.6
  vite: 8.0.0-beta.3
  vitest: 4.0.15
  zshy: 0.6.0

catalogs:
  typedoc:latest:
    typedoc: 0.28.15
    typedoc-plugin-dt-links: 2.0.32
    typedoc-plugin-extras: 4.0.1
    typedoc-plugin-include-example: 3.0.2
    typedoc-plugin-mdn-links: 5.0.10
    typedoc-plugin-missing-exports: 4.1.2

  textlint:latest:
    textlint: 15.5.0
    textlint-filter-rule-allowlist: 4.0.0
    textlint-filter-rule-comments: 1.2.2
    textlint-rule-terminology: 5.2.16

  commitlint:latest:
    "@commitlint/cli": 20.2.0
    "@commitlint/config-conventional": 20.2.0
    "@commitlint/cz-commitlint": 20.2.0
    "@commitlint/types": 20.2.0
    commitizen: 4.3.1
    inquirer: ^9.3.8
  commitlint:peer:
    "@commitlint/cli": ^20.0.0

  peer:
    "@arethetypeswrong/core": ^0.18.0
    "@biomejs/biome": ^2.0.0
    publint: ^0.3.0
    tsdown: ^0.17.0
    typescript: ^5.0.0
    unplugin-unused: ^0.5.0
    vite: ^8.0.0-beta
    vitest: ^4.0.0
    zshy: ^0.6.0

engineStrict: true

failIfNoMatch: true

includeWorkspaceRoot: false

nodeLinker: isolated

onlyBuiltDependencies:
  - esbuild
  - lefthook

overrides:
  ## https://github.com/advisories/GHSA-3xgq-45jj-v275
  cross-spawn@>=7.0.0 <7.0.5: ">=7.0.5"
  ## https://github.com/advisories/GHSA-52f5-9888-hmc6
  tmp@<=0.2.3: ">=0.2.4"

packageManagerStrict: true

packageManagerStrictVersion: true

preferWorkspacePackages: true

saveWorkspaceProtocol: rolling

sharedWorkspaceLockfile: true

publishBranch: main
