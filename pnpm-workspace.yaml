## https://pnpm.io/settings
nodeLinker: isolated

engineStrict: true
packageManagerStrict: true
packageManagerStrictVersion: true

includeWorkspaceRoot: false
preferWorkspacePackages: true
sharedWorkspaceLockfile: true
saveWorkspaceProtocol: rolling
failIfNoMatch: true

packages:
  - "@kcconfigs/*"
  - "@kcexamples/*"
  - "@kcinternals/*"
  - "@kctools/*"
  - "@kctypes/*"
  - "@kcutils/*"
  - "@kcws/*"
  - "!**/.*.old/**"

catalog:
  "@types/node": ^22.0.0
  ## Update json schema version in @kcconfigs/biome as well
  "@biomejs/biome": 2.3.8
  "@vitest/coverage-v8": 4.0.15
  "@vitest/ui": 4.0.15
  publint: 0.3.15
  typescript: 5.9.3
  vite: 8.0.0-beta.0
  vitest: 4.0.15
  tsdown: 0.17.1
  typedoc: 0.28.15
  zshy: 0.6.0

catalogs:
  peer:
    "@biomejs/biome": ^2.0.0
    publint: ^0.3.0
    typescript: ^5.0.0
    vite: ^8.0.0-beta
    vitest: ^4.0.0
    tsdown: ^0.17.0
    zshy: ^0.6.0
